# Local SQL Server 2022 (Developer edition) for the SQL-backed tests and the
# SQL storage mode. The app itself runs with `dotnet run` on the host.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    hostname: traceops-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:14331:1433"
    volumes:
      - ./sql:/sql:ro
      - ./src/TraceOps.SqlServer/Migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
